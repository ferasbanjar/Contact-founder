name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir /tmp/src
          cp pubspec.yaml *.dart /tmp/src/
          flutter create --platforms=android --project-name contacts_search --org com.example .
          cp /tmp/src/pubspec.yaml pubspec.yaml
          cp /tmp/src/*.dart lib/
          rm -f ./*.dart

      - name: Add permissions
        run: python3 patch_manifest.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: contacts-search-apk
          path: build/app/outputs/flutter-apk/app-release.apk
